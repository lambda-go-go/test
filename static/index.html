<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Multiplayer Parkour Space</title>
  <link rel="stylesheet" href="/static/style.css?v=4.0">
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- 3D 렌더링 캔버스 컨테이너 -->
  <div id="canvas-container"></div>

  <!-- UI 오버레이 -->
  <div class="ui-layer">
    <!-- 상단 바 -->
    <header class="top-bar">
      <div class="brand">
        <span class="status-dot"></span>
        <span class="title">🏃‍♂️ 3D Parkour Space</span>
        <span id="player-count" class="badge">온라인: 1명</span>
      </div>
      <div class="actions">
        <!-- 난이도별 코스 이동 바로가기 버튼들 -->
        <button id="tp-normal-btn" class="btn btn-course btn-normal" title="노멀 코스 입구로 이동">
          <span>🟢 노멀 코스</span>
        </button>
        <button id="tp-hard-btn" class="btn btn-course btn-hard" title="하드 코스 입구로 이동">
          <span>🔥 하드 코스</span>
        </button>
        <button id="reset-pos-btn" class="btn btn-secondary" title="중앙 스폰으로 이동">
          <span>🔄 스폰</span>
        </button>
        <button id="copy-link-btn" class="btn btn-primary" title="친구에게 보낼 주소 복사">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          <span id="copy-btn-text">링크 복사</span>
        </button>
      </div>
    </header>

    <!-- 하단 조작 가이드 -->
    <div class="bottom-bar">
      <div class="instructions-card">
        <div class="instruction-item">
          <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
          <span>이동</span>
        </div>
        <div class="instruction-item">
          <kbd>Space</kbd>
          <span>점프</span>
        </div>
        <div class="instruction-item">
          <kbd>Shift</kbd>
          <span>방향키 대시 (원하는 방향으로 돌진!)</span>
        </div>
        <div class="instruction-item">
          <kbd>1~6</kbd>
          <span>이모티콘</span>
        </div>
      </div>
    </div>

    <!-- 화면 중앙 하단: 감정표현(이모티콘) 바 -->
    <div class="emote-bar-container">
      <div class="emote-bar">
        <button class="emote-btn" data-emote="👋" title="안녕 [1]"><span>👋</span><small>1</small></button>
        <button class="emote-btn" data-emote="❤️" title="하트 [2]"><span>❤️</span><small>2</small></button>
        <button class="emote-btn" data-emote="😂" title="웃음 [3]"><span>😂</span><small>3</small></button>
        <button class="emote-btn" data-emote="🎉" title="축하 [4]"><span>🎉</span><small>4</small></button>
        <button class="emote-btn" data-emote="🔥" title="불꽃 [5]"><span>🔥</span><small>5</small></button>
        <button class="emote-btn" data-emote="👑" title="왕관 [6]"><span>👑</span><small>6</small></button>
      </div>
    </div>

    <!-- 모바일 조작 (이동 패드 & 점프/대시 버튼) -->
    <div id="mobile-controls" class="mobile-only">
      <div class="d-pad">
        <button class="d-btn up" data-key="KeyW">▲</button>
        <div class="d-row">
          <button class="d-btn left" data-key="KeyA">◀</button>
          <button class="d-btn down" data-key="KeyS">▼</button>
          <button class="d-btn right" data-key="KeyD">▶</button>
        </div>
      </div>
      <div class="action-buttons">
        <button id="mobile-dash-btn" class="action-btn dash-btn">
          <span>⚡ DASH</span>
        </button>
        <button id="mobile-jump-btn" class="action-btn jump-btn">
          <span>⬆ JUMP</span>
        </button>
      </div>
    </div>

    <!-- 알림 토스트 메시지 -->
    <div id="toast" class="toast">접속 주소가 클립보드에 복사되었습니다!</div>
  </div>

  <script src="/static/app.js?v=4.0"></script>
</body>
</html>
