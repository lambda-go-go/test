<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Space - 실시간 가상 공간 & 화상통화</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- 3D 렌더링 캔버스 컨테이너 -->
  <div id="canvas-container"></div>

  <!-- UI 오버레이 -->
  <div class="ui-layer">
    <!-- 상단 바 -->
    <header class="top-bar">
      <div class="brand">
        <span class="status-dot"></span>
        <span class="title">3D Space</span>
        <span id="player-count" class="badge">온라인: 1명</span>
        <span id="call-count" class="badge call-badge" style="display: none;">📞 통화 중: 0명</span>
      </div>
      <div class="actions">
        <button id="copy-link-btn" class="btn btn-primary" title="친구에게 보낼 주소 복사">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          <span id="copy-btn-text">링크 복사</span>
        </button>
      </div>
    </header>

    <!-- 하단 조작 가이드 -->
    <div class="bottom-bar">
      <div class="instructions-card">
        <div class="instruction-item">
          <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>방향키</kbd>
          <span>이동</span>
        </div>
        <div class="instruction-item">
          <span>마우스 드래그</span>
          <span>시점 회전</span>
        </div>
        <div class="instruction-item">
          <span>마우스 휠</span>
          <span>줌 인/아웃</span>
        </div>
      </div>
    </div>

    <!-- 모바일 가상 조이스틱 (터치 디바이스용) -->
    <div id="mobile-controls" class="mobile-only">
      <div class="d-pad">
        <button class="d-btn up" data-key="KeyW">▲</button>
        <div class="d-row">
          <button class="d-btn left" data-key="KeyA">◀</button>
          <button class="d-btn down" data-key="KeyS">▼</button>
          <button class="d-btn right" data-key="KeyD">▶</button>
        </div>
      </div>
    </div>

    <!-- 화면 오른쪽 아래: 화상통화 위젯 -->
    <div id="call-widget" class="call-widget">
      <!-- 1. 통화 참여 전: 참여 버튼 -->
      <button id="join-call-btn" class="btn btn-call-join">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
        <span>통화 참여</span>
      </button>

      <!-- 2. 통화 참여 후: 비디오 그리드 및 컨트롤 바 -->
      <div id="active-call-panel" class="active-call-panel" style="display: none;">
        <!-- 비디오 목록 그리드 -->
        <div id="video-grid" class="video-grid">
          <!-- 로컬(내) 비디오 박스 -->
          <div id="local-video-container" class="video-card">
            <video id="local-video" autoplay playsinline muted></video>
            <div class="video-label">나 (You)</div>
          </div>
          <!-- 원격 유저들의 비디오는 동적으로 추가됨 -->
        </div>

        <!-- 통화 조작 툴바 -->
        <div class="call-controls">
          <button id="toggle-mic-btn" class="call-ctrl-btn" title="마이크 켜기/끄기">
            <span class="icon">🎙️</span>
          </button>
          <button id="toggle-cam-btn" class="call-ctrl-btn" title="카메라 켜기/끄기">
            <span class="icon">📷</span>
          </button>
          <button id="leave-call-btn" class="call-ctrl-btn btn-leave" title="통화 종료">
            <span class="icon">📞</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 복사 알림 토스트 메시지 -->
    <div id="toast" class="toast">접속 주소가 클립보드에 복사되었습니다!</div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
